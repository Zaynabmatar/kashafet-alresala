<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاجتماعات - كشافة الرسالة</title>

  <link rel="stylesheet" href="../styles/admin.css" />
  <link rel="stylesheet" href="../styles/meetings.css" />
</head>
<body>
  <header class="topbar">
    <div class="user-area">
      <button
        class="menu-button"
        id="backToAdminButton"
        type="button"
        title="العودة إلى قائمة القادة"
        aria-label="العودة إلى قائمة القادة"
      >
        ‹
      </button>
      <div class="page-topbar-title">الاجتماعات</div>
    </div>
  </header>

  <main class="meetings-page">
    <section class="page-header meetings-header">
      <div>
        <h1>الاجتماعات</h1>
      </div>

      <button
        class="add-meeting-button"
        id="openMeetingModalButton"
        type="button"
      >
        <span>＋</span>
        إضافة اجتماع
      </button>
    </section>

    <section class="meetings-list-section">
      <div class="meetings-list-section-header">
        <h2 class="meetings-list-title">سجل الاجتماعات</h2>

        <div class="meetings-year-control">
          <select id="yearFilter" class="year-filter"></select>
        </div>
      </div>

      <div id="meetingsList" class="meetings-list">
        <div class="empty-state">لا يوجد اجتماعات بعد</div>
      </div>
    </section>
  </main>

  <div id="meetingModal" class="meeting-modal">
    <div class="meeting-modal-box">
      <div class="meeting-modal-header">
        <h2>إضافة اجتماع</h2>

        <button
          class="close-modal-button"
          id="closeMeetingModalButton"
          type="button"
          aria-label="إغلاق"
        >
          ×
        </button>
      </div>

      <div class="meeting-date-section">
        <label for="meetingDateTrigger">تاريخ الاجتماع</label>

        <div class="custom-date-picker" id="meetingDatePicker">
          <div class="typed-date-wrapper">
            <input
              type="text"
              id="meetingDateText"
              class="typed-date-input"
              inputmode="numeric"
              autocomplete="off"
              placeholder="٢٢/٠٩/٢٠٢٦"
              maxlength="10"
            />

            <button
              id="meetingDateTrigger"
              class="calendar-icon-button"
              type="button"
              aria-expanded="false"
              aria-label="فتح الرزنامة"
            >
              📅
            </button>
          </div>

          <input type="hidden" id="meetingDate" />

          <div
            id="meetingDatePopover"
            class="custom-date-popover"
            aria-hidden="true"
          >
            <div class="date-picker-selects">
              <select id="meetingDay" aria-label="اليوم"></select>
              <select id="meetingMonth" aria-label="الشهر"></select>
              <select id="meetingYear" aria-label="السنة"></select>
            </div>
          </div>
        </div>
      </div>

      <div class="attendees-section">
        <div class="leader-search">
          <span>⌕</span>
          <input
            type="text"
            id="leaderSearch"
            placeholder="بحث عن قائد..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div id="leadersList" class="leaders-list"></div>
      </div>

      <button
        id="saveMeetingButton"
        class="save-meeting-button"
        type="button"
      >
        حفظ الاجتماع
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <script src="meetings.js"></script>
</body>
</html>
