<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قائمة القادة</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <link rel="stylesheet" href="../styles/admin.css" />
  </head>

  <body>
    <!-- =========================
       TOPBAR
  ========================= -->
    <header class="topbar">
      <div class="user-area">
        <button
          class="menu-button"
          id="sidebarToggle"
          type="button"
        >
          ☰
        </button>
        <div class="profile-image" id="adminProfileImage">
          <span>👤</span>
        </div>
        <span class="user-name" id="userName"></span>
      </div>
    </header>

    <!-- =========================
       SIDEBAR
  ========================= -->
    <aside class="admin-sidebar" id="adminSidebar">
      <button class="sidebar-item" type="button" id="myInfoButton">
        👤 معلوماتي
      </button>

      <div class="sidebar-stat">
        <span class="sidebar-people-icon" aria-hidden="true">👥</span>
        <span>
          عدد القادة:
          <strong id="leadersCount">0</strong>
        </span>
      </div>

      <div class="sidebar-stat missing-uniform-stat">
        🔴
        <span>
          عدد البدلات الناقصة:
          <strong id="missingUniformCount">0</strong>
        </span>
      </div>

      <div class="topbar-actions">
        <button
          class="trash-button"
          type="button"
          id="trashButton"
        >
          🗑️ سلة المحذوفات
          <span class="trash-count" id="trashCount">0</span>
        </button>

        <button class="logout-button" id="logoutButton" type="button">
          تسجيل الخروج
        </button>
      </div>
    </aside>

    <!-- =========================
       MAIN
  ========================= -->
    <main class="container">
      <div class="page-header">
        <div>
          <h1>قائمة القادة</h1>
          <p>إدارة القادة والفرق التابعة لهم</p>
        </div>

        <div class="header-actions">
          <button
            class="add-leader"
            id="addLeaderButton"
            type="button"
          >
            <span>+</span>
            إضافة قائد
          </button>

          <button
            class="add-meetings"
            id="meetingsButton"
            type="button"
          >
            الاجتماعات
          </button>
        </div>
      </div>

      <!-- =========================
         LEADERS LIST
    ========================= -->
      <section class="leaders-table-wrapper">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">👥</div>

          <h2>لا يوجد قادة بعد</h2>

          <p>اضغط على «إضافة قائد» لإضافة أول قائد.</p>
        </div>

        <div class="leaders-table" id="leadersTable"></div>
      </section>
    </main>

    <!-- =========================
       ADD LEADER MODAL
  ========================= -->
    <div class="modal-overlay" id="leaderModal">
      <div class="modal">
        <div class="modal-header">
          <div>
            <h2>إضافة قائد</h2>
            <p>أدخل معلومات القائد أو القائدة</p>
          </div>

          <button
            class="close-button"
            type="button"
          >
            ×
          </button>
        </div>

        <form id="leaderForm">
          <!-- الاسم -->
          <div class="form-group">
            <label for="leaderName"> اسم القائد / القائدة </label>

            <input
              type="text"
              id="leaderName"
              value="القائد"
              placeholder="أدخل الاسم الكامل بالعربية"
              required
              lang="ar"
              dir="rtl"
            />
          </div>

          <!-- المساعدون -->
          <div class="form-group">
            <label for="leaderAssistants"> أسماء المساعدين </label>

            <input
              type="text"
              id="leaderAssistants"
              placeholder="مثال: اسم 1 / اسم 2"
              autocomplete="off"
              lang="ar"
              dir="rtl"
            />
          </div>

          <!-- الهاتف -->
          <div class="form-group">
            <label for="leaderPhone"> رقم الهاتف </label>

            <div class="phone-input">
              <span class="country-code"> +961 </span>

              <input
                type="tel"
                id="leaderPhone"
                placeholder="أدخل رقم الهاتف"
                autocomplete="off"
              />
            </div>
          </div>

          <!-- تاريخ الميلاد -->
          <div class="form-group">
            <label>تاريخ الميلاد</label>

            <div class="birth-date-inputs">
              <input
                type="text"
                id="birthDay"
                inputmode="numeric"
                placeholder="اليوم"
                autocomplete="off"
              />
              <input
                type="text"
                id="birthMonth"
                placeholder="الشهر"
                autocomplete="off"
              />
              <input
                type="text"
                id="birthYear"
                inputmode="numeric"
                placeholder="السنة"
                autocomplete="off"
              />
            </div>

            <input type="hidden" id="birthDateInput" />
          </div>
          <!-- المهمة -->
          <div class="form-group">
            <label for="leaderBranch"> المهمة </label>

            <div class="task-combobox" id="taskComboBox">
              <input
                type="text"
                id="leaderBranch"
                placeholder="ابحث أو اختر المهمة"
                autocomplete="off"
              />

              <div id="tasksDropdown" class="tasks-dropdown"></div>
            </div>
          </div>

          <!-- البدلة -->
          <div class="form-group">
            <label> البدلة </label>

            <div class="uniform-options">
              <label class="radio-option has-uniform-option">
                <input type="radio" name="hasUniform" value="true" />

                <span> ✓ 👕 البدلة موجودة </span>
              </label>

              <label class="radio-option no-uniform-option">
                <input type="radio" name="hasUniform" value="false" checked />

                <span> ✕ 👕 لا توجد بدلة </span>
              </label>
            </div>
          </div>

          <!-- Buttons -->
          <div class="form-actions">
            <button
              type="button"
              class="cancel-button"
            >
              إلغاء
            </button>

            <button type="submit" class="save-button" id="saveLeaderButton">
              حفظ
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
