<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قائمة القادة</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>

    <link rel="stylesheet" href="../styles/admin.css" />
  <style>
.task-combobox {
    position: relative;
    width: 100%;
}

.task-combobox input {
    width: 100%;
    height: 44px;
    box-sizing: border-box;
    padding: 0 14px;
    border: 1px solid rgba(0, 0, 0, 0.14);
    border-radius: 10px;
    background: #fff;
    font: inherit;
    color: #222;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.task-combobox input:focus {
    border-color: rgba(0, 0, 0, 0.3);
    box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
}

.tasks-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 10000;
    display: none;
    max-height: 210px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
    scroll-behavior: smooth;
}

.tasks-dropdown.open {
    display: block;
}

.task-option,
.add-task-option {
    min-height: 42px;
    padding: 10px 14px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    cursor: pointer;
    text-align: right;
    transition: background 0.15s ease;
}

.task-option:hover,
.add-task-option:hover {
    background: rgba(0, 0, 0, 0.045);
}

.add-task-option {
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    font-weight: 600;
}

.task-action-buttons {
    display: flex;
    gap: 8px;
    padding: 10px;
}

.task-action-buttons button {
    flex: 1;
    min-height: 40px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    transition: background 0.15s ease, transform 0.1s ease;
}

.task-action-buttons button:active {
    transform: scale(0.98);
}

.save-task-button {
    background: #f2f2f2;
    color: #222;
}

.save-task-button:hover {
    background: #e8e8e8;
}

.cancel-task-button {
    background: #f5f5f5;
    color: #666;
}

.cancel-task-button:hover {
    background: #e9e9e9;
}
.save-task-button {
    width: calc(100% - 20px);
    margin: 10px;
    min-height: 40px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    background: #f2f2f2;
    color: #222;
    transition: background 0.15s ease;
}

.save-task-button:hover {
    background: #e8e8e8;
}

.tasks-dropdown::-webkit-scrollbar {
    width: 6px;
}

.tasks-dropdown::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.18);
    border-radius: 10px;
}

.tasks-dropdown::-webkit-scrollbar-track {
    background: transparent;
}
</style>
<style id="task-buttons-fix">
.task-action-buttons {
    display: flex !important;
    flex-direction: row !important;
    align-items: stretch !important;
    gap: 8px !important;
    width: 100% !important;
    box-sizing: border-box !important;
    padding: 10px !important;
}

.task-action-buttons button {
    flex: 1 1 0 !important;
    width: 0 !important;
    min-width: 0 !important;
    height: 40px !important;
    margin: 0 !important;
    padding: 0 12px !important;
    border: 0 !important;
    border-radius: 8px !important;
    box-sizing: border-box !important;
    font-family: inherit !important;
    font-size: 14px !important;
    font-weight: 700 !important;
    line-height: 40px !important;
    text-align: center !important;
    cursor: pointer !important;
}

.task-action-buttons .save-task-button,
.task-action-buttons .cancel-task-button {
    background: #f5f5f5 !important;
    color: #222 !important;
}

.task-action-buttons button:hover {
    background: #e9e9e9 !important;
}
</style>
<style id="task-buttons-font-fix">
.task-action-buttons button,
.task-action-buttons button.save-task-button,
.task-action-buttons button.cancel-task-button {
    font-family: inherit !important;
    font-size: 14px !important;
    font-weight: 700 !important; line-height: 40px !important;
    letter-spacing: normal !important;
    text-transform: none !important;
    text-shadow: none !important;
}
</style>
<style id="leader-info-button-fix">
.leader-info-button {
    width: 100%;
    min-height: 38px;
    margin-top: 8px;
    padding: 8px 12px;
    border: 1px solid #cfded5;
    border-radius: 10px;
    background: #f7faf8;
    color: #225d3c;
    display: flex;
    align-items: center;
    justify-content: space-between;
    direction: rtl;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.leader-info-button:hover {
    background: #eaf3ed;
}

.leader-info-arrow {
    font-size: 20px;
    line-height: 1;
    direction: ltr;
}

@media (max-width: 600px) {
    .leader-info-button {
        width: 100%;
        min-height: 34px;
        margin-top: 4px;
        padding: 6px 10px;
        font-size: 12px;
    }

    .leader-info-arrow {
        font-size: 19px;
    }
}
</style><style id="leader-info-button-size-fix">
.leader-info-button {
    width: 100% !important; min-width: 0 !important; max-width: none !important;
    min-height: 34px !important;
    height: 34px !important;
    margin-top: 0 !important;
    padding: 6px 10px !important;
    border: 1px solid #d7e1db !important;
    border-radius: 8px !important;
    background: #f7faf8 !important;
    color: #225d3c !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: 7px !important;
    direction: rtl !important;
    font-family: inherit !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    cursor: pointer !important;
    flex-shrink: 0 !important;
}

.leader-info-arrow {
    font-size: 17px !important;
    line-height: 1 !important;
    direction: ltr !important;
    flex-shrink: 0 !important;
}

@media (max-width: 600px) {
    .leader-info-button {
        width: 100% !important; min-width: 0 !important; max-width: none !important;
        height: 32px !important;
        min-height: 32px !important;
        padding: 5px 9px !important;
        font-size: 11px !important;
    }

    .leader-info-arrow {
        font-size: 16px !important;
    }
}
</style></head>

  <body>
    <header class="topbar">
  <div class="user-area">
    <button class="menu-button" type="button" onclick="document.getElementById('adminSidebar').classList.toggle('open')">☰</button>

    <div class="profile-image" id="adminProfileImage">
      <span>👤</span>
    </div>

    <span class="user-name" id="userName"></span>
  </div>
</header>

<aside class="admin-sidebar" id="adminSidebar">
  <button class="sidebar-item" type="button" id="myInfoButton">👥 معلوماتي</button>

  <div class="sidebar-stat">
    👤 <span>عدد القادة: <strong id="leadersCount">0</strong></span>
  </div>

  <div class="sidebar-stat missing-uniform-stat">
    🔴 <span>عدد البدلات الناقصة: <strong id="missingUniformCount">0</strong></span>
  </div>

  <div class="topbar-actions">
    <button
      class="trash-button"
      type="button"
      onclick="window.location.href='trash.html'"
    >
      🗑️ سلة المحذوفات
      <span class="trash-count" id="trashCount">0</span>
    </button>

    <button class="logout-button" type="button" onclick="logout()">
      تسجيل الخروج
    </button>
  </div>
</aside>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>قائمة القادة</h1>
          <p>إدارة القادة والفرق التابعة لهم</p>
        </div>

        <button class="add-leader" type="button" onclick="openAddLeaderForm()">
          <span>+</span>
          إضافة قائد
        </button>
      </div>

      <section class="leaders-table-wrapper">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">👥</div>

          <h2>لا يوجد قادة بعد</h2>

          <p>اضغط على «إضافة قائد» لإضافة أول قائد.</p>
        </div>

        <div class="leaders-table" id="leadersTable"></div>
      </section>
    </main>

    <!-- =========================
     Add Leader Modal
========================= -->

    <div class="modal-overlay" id="leaderModal">
      <div class="modal">
        <div class="modal-header">
          <div>
            <h2>إضافة قائد</h2>

            <p>أدخل معلومات القائد أو القائدة</p>
          </div>

          <button
            class="close-button"
            type="button"
            onclick="closeAddLeaderForm()"
          >
            ×
          </button>
        </div>

        <form id="leaderForm">
          <!-- الاسم -->

          <div class="form-group">
            <label for="leaderName"> اسم القائد / القائدة </label>

            <input
              type="text"
              id="leaderName"
              value="القائد"
              placeholder="أدخل الاسم الكامل بالعربية"
              required
              lang="ar"
              dir="rtl"
              oninput="
                this.value = this.value.replace(/[^\u0600-\u06FF\s]/g, '')
              "
            />
          </div>

          <!-- المساعدون -->

          <div class="form-group">
            <label for="leaderAssistants">أسماء المساعدين</label>

            <input
              type="text"
              id="leaderAssistants"
              placeholder="مثال: اسم 1 / اسم 2"
              autocomplete="off"
              lang="ar"
              dir="rtl"
              oninput="this.value = this.value.replace(/[^\u0600-\u06FF\s\/]/g, '')"
            />
          </div>

          <!-- الهاتف -->

          <div class="form-group">
            <label for="leaderPhone"> رقم الهاتف </label>

            <div class="phone-input">
              <span class="country-code"> +961 </span>

              <input
                type="tel"
                id="leaderPhone"
                placeholder="أدخل رقم الهاتف"
                autocomplete="off"
              />
            </div>
          </div>

          <!-- تاريخ الميلاد -->

          <div class="form-group">
            <label> تاريخ الميلاد </label>

            <div class="birth-date">
              <select id="birthDay">
                <option value="">اليوم</option>
              </select>

              <select id="birthMonth">
                <option value="">الشهر</option>
              </select>

              <select id="birthYear">
                <option value="">السنة</option>
              </select>
            </div>
          </div>

          <!-- المهمة -->

          <div class="form-group">
            <label for="leaderBranch"> المهمة </label>

            <div class="task-combobox" id="taskComboBox">
              <input
                type="text"
                id="leaderBranch"
                placeholder="ابحث أو اختر المهمة"
                autocomplete="off"
              />
              <div id="tasksDropdown" class="tasks-dropdown"></div>
            </div>
          </div>

          <!-- البدلة -->

          <div class="form-group">
            <label> البدلة </label>

            <div class="uniform-options">
              <label class="radio-option has-uniform-option"><input type="radio" name="hasUniform" value="true" /><span>✓ 👕 البدلة موجودة</span></label>

              <label class="radio-option no-uniform-option"><input type="radio" name="hasUniform" value="false" checked /><span>✕ 👕 لا توجد بدلة</span></label>
            </div>
          </div>

          <!-- Buttons -->

          <div class="form-actions">
            <button
              type="button"
              class="cancel-button"
              onclick="closeAddLeaderForm()"
            >
              إلغاء
            </button>

            <button type="submit" class="save-button" id="saveLeaderButton">
              حفظ
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      /* =====================================================
   ADMIN NAME
===================================================== */

      async function loadAdminName() {
        try {
          const { data, error } = await AppDb.getAdminSummary();

          if (error) {
            console.error("Error loading admin:", error);

            return;
          }

          const profileImage = document.getElementById("adminProfileImage"); if (profileImage) { profileImage.innerHTML = data && data.profile_image ? "<img src=\"" + data.profile_image + "\" alt=\"صورة البروفايل\">" : "<span>👤</span>"; } if (data && data.full_name) {
            document.getElementById("userName").textContent = data.full_name;
          }
        } catch (error) {
          console.error("Admin loading error:", error);
        }
      }

      /* =====================================================
   DATE SELECTORS
===================================================== */

      function setupDateSelectors() {
        const daySelect = document.getElementById("birthDay");

        const monthSelect = document.getElementById("birthMonth");

        const yearSelect = document.getElementById("birthYear");

        if (!daySelect || !monthSelect || !yearSelect) {
          return;
        }

        if (daySelect.options.length === 1) {
          for (let day = 1; day <= 31; day++) {
            const option = document.createElement("option");

            option.value = day;
            option.textContent = day;

            daySelect.appendChild(option);
          }
        }

        if (monthSelect.options.length === 1) {
          const months = [
            "كانون الثاني",
            "شباط",
            "آذار",
            "نيسان",
            "أيار",
            "حزيران",
            "تموز",
            "آب",
            "أيلول",
            "تشرين الأول",
            "تشرين الثاني",
            "كانون الأول",
          ];

          months.forEach(function (month, index) {
            const option = document.createElement("option");

            option.value = index + 1;

            option.textContent = month;

            monthSelect.appendChild(option);
          });
        }

        if (yearSelect.options.length === 1) {
          const currentYear = new Date().getFullYear();

          for (let year = currentYear; year >= 1940; year--) {
            const option = document.createElement("option");

            option.value = year;
            option.textContent = year;

            yearSelect.appendChild(option);
          }
        }
      }

      /* =====================================================
   MODAL
===================================================== */

      function openAddLeaderForm() {
        const modal = document.getElementById("leaderModal");

        if (modal) {
          modal.classList.add("active");
        }
      }

      function closeAddLeaderForm() {
        const modal = document.getElementById("leaderModal");

        if (modal) {
          modal.classList.remove("active");
        }
      }

      /* =====================================================
   AGE
===================================================== */

      function calculateAge(birthDate) {
        if (!birthDate) {
          return "غير محدد";
        }

        const birth = new Date(birthDate);

        if (isNaN(birth.getTime())) {
          return "غير محدد";
        }

        const today = new Date();

        let age = today.getFullYear() - birth.getFullYear();

        const monthDifference = today.getMonth() - birth.getMonth();

        if (
          monthDifference < 0 ||
          (monthDifference === 0 && today.getDate() < birth.getDate())
        ) {
          age--;
        }

        return age >= 0 ? `${age} سنة` : "غير محدد";
      }

      /* =====================================================
   LOAD LEADERS FROM SUPABASE
===================================================== */

      async function loadLeaders() {
        const table = document.getElementById("leadersTable");

        const emptyState = document.getElementById("emptyState");

        if (!table || !emptyState) {
          return false;
        }

        try {
          const { data, error } = await AppDb.listActiveLeaders();

          if (error) {
            throw error;
          }

          table.innerHTML = "";

          const leadersCount = document.getElementById("leadersCount");
    const missingUniformCount = document.getElementById("missingUniformCount");
    if (leadersCount) leadersCount.textContent = data ? data.length : 0;
    if (missingUniformCount) missingUniformCount.textContent = data ? data.filter(function(leader) { return leader.has_uniform === false; }).length : 0;

    if (!data || data.length === 0) {
            table.style.display = "none";

            emptyState.style.display = "block";

            return true;
          }

          emptyState.style.display = "none";

          table.style.display = "flex";

          data.forEach(function (leader) {
            addLeaderToTable({
              id: leader.id,

              name: leader.full_name,
              assistants: leader.assistants,

              phone: leader.phone,

              birthDate: leader.birth_date,

              branch: leader.branch,

              uniform: leader.has_uniform,

              activities: leader.activities || 0,
            });
          });

          return true;
        } catch (error) {
          console.error("Error loading leaders:", error);

          table.innerHTML = "";

          table.style.display = "none";

          emptyState.style.display = "block";

          /*
           * مهم:
           * loadLeaders ترجع false فقط.
           * ما رح ترمي error للحفظ.
           */

          return false;
        }
      }

      /* =====================================================
   SAVE NEW LEADER
===================================================== */

      const leaderForm = document.getElementById("leaderForm");

      if (leaderForm) {
        leaderForm.addEventListener("submit", async function (event) {
          event.preventDefault();

          const name = document.getElementById("leaderName").value.trim();
          const assistants = document.getElementById("leaderAssistants").value.trim();

          const phone = document.getElementById("leaderPhone").value.trim();

          const day = document.getElementById("birthDay").value;

          const month = document.getElementById("birthMonth").value;

          const year = document.getElementById("birthYear").value;

          const branch = document.getElementById("leaderBranch").value.trim();

          const uniformInput = document.querySelector(
            'input[name="hasUniform"]:checked',
          );

          const uniform = uniformInput ? uniformInput.value === "true" : false;

          /* Validation */

          if (!name) {
            alert("يرجى إدخال اسم القائد.");

            return;
          }

          if (!branch) {
            alert("يرجى اختيار المهمة.");

            return;
          }

          /* Birth date */

          let birthDate = null;

          if (day && month && year) {
            birthDate = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          }

          /* Save button */

          const saveButton = document.getElementById("saveLeaderButton");

          if (saveButton) {
            saveButton.disabled = true;

            saveButton.textContent = "جارٍ الحفظ...";
          }

          try {
            /* =================================================
                   STEP 1 — ACTUAL DATABASE INSERT
                ================================================= */

            const { data, error } = await AppDb.createLeader({
              full_name: name,
              assistants: assistants || null,
              phone: phone || null,
              birth_date: birthDate,
              branch: branch,
              has_uniform: uniform,
            });

            /*
             * إذا Supabase أعطى error،
             * الحفظ فشل فعلًا.
             */

            if (error) {
              throw error;
            }

            /*
             * إذا وصلنا لهون:
             * القائد انحفظ فعليًا في Database.
             */

            console.log("Leader saved successfully:", data);

            /* =================================================
                   STEP 2 — UPDATE THE LIST
                ================================================= */

            const listLoaded = await loadLeaders(); loadTrashCount();

            /*
             * حتى لو صار مشكلة بتحديث القائمة،
             * ما منعتبر عملية الحفظ فاشلة.
             */

            if (!listLoaded) {
              console.warn(
                "Leader was saved, but the list could not be refreshed.",
              );
            }

            /* =================================================
                   STEP 3 — RESET FORM
                ================================================= */

            leaderForm.reset();

            const defaultUniform = document.querySelector(
              'input[name="hasUniform"][value="false"]',
            );

            if (defaultUniform) {
              defaultUniform.checked = true;
            }

            closeAddLeaderForm();

            /* =================================================
                   STEP 4 — SUCCESS
                ================================================= */

            alert("تم حفظ القائد بنجاح.");
          } catch (error) {
            console.error("Error saving leader:", error);

            alert(
              "تعذّر حفظ القائد:" + (error.message || "حدث خطأ غير معروف."),
            );
          } finally {
            if (saveButton) {
              saveButton.disabled = false;

              saveButton.textContent = "حفظ";
            }
          }
        });
      }

      /* =====================================================
   LEADER CARD
===================================================== */

      function addLeaderToTable(leader) {
        const table = document.getElementById("leadersTable");

        const emptyState = document.getElementById("emptyState");

        if (!table || !emptyState) {
          return;
        }

        emptyState.style.display = "none";

        table.style.display = "flex";

        const card = document.createElement("div");

        card.className = "leader-row";

        card.setAttribute("role", "link");

        card.setAttribute("tabindex", "0");
        card.dataset.leaderId = leader.id;

        const age = calculateAge(leader.birthDate);

        const phone = leader.phone
          ? String(leader.phone).replace(/^\+961\s*/, "")
          : "غير محدد";

        const uniformIcon = leader.uniform
          ? '<span class="uniform-check has-uniform">✓</span><span class="uniform-clothes">👕</span><span class="uniform-text has-uniform">البدلة موجودة</span>'
          : '<span class="uniform-check no-uniform">✕</span><span class="uniform-clothes">👕</span><span class="uniform-text no-uniform">لا توجد بدلة</span>';

        card.innerHTML = `

        <div class="leader-main">

            <div class="leader-profile">

                <div class="leader-avatar">
                    👤
                </div>

                <div class="leader-identity">

                    <div class="leader-name-phone">
                        <h3>${escapeHtml(leader.name)}</h3>
                        <span class="leader-phone">${phone === "غير محدد📞" ? "غير محدد" : "📞 +961 " + escapeHtml(phone)}</span>
                    </div>

                    ${
                      leader.assistants
                        ? `<p class="leader-assistants">أسماء المساعدين: ${escapeHtml(leader.assistants)}</p>`
                        : ""
                    }

                    <p style="display:none;">

                        ${phone === "غير محدد📞" ? "غير محدد📞" : "📞 +961 " + escapeHtml(phone)}

                    </p>

                </div>

            </div>


            <div class="leader-info">

                <div class="compact-info">

                    <span class="compact-icon">
                        📅
                    </span>

                    <strong>
                        ${leader.birthDate ? escapeHtml(age) + " سنة" : "غير محدد العمر"}
                    </strong>

                </div>


                <div class="compact-info">

                    <span class="compact-icon">
                        👥
                    </span>

                    <strong>
                        ${escapeHtml(leader.branch || "غير محددة")}
                    </strong>

                </div>


                <div class="compact-info">

                    <strong>
                        ${uniformIcon}
                    </strong>

                </div>

            </div>


            <div class="activities-box">

                <span>
                    عدد النشاطات
                </span>

                <strong>
                    ${leader.activities || 0}
                </strong>

            </div>


            <div class="leader-actions">
  <button type="button" class="leader-info-button" onclick="event.stopPropagation(); window.location.href='../leader/leader.html?id=${leader.id}'">
    <span>معلومات القائد</span>
    <span class="leader-info-arrow">←</span>
  </button>
</div>

        </div>

    `;

        function openLeaderPage() {
          if (!leader.id) return;

          window.location.href =
            "../leader/leader.html?id=" + encodeURIComponent(leader.id);

        card.addEventListener("click", openLeaderPage);

        card.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();

            openLeaderPage();
          }
        });

        table.appendChild(card);

===================================================== */

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")

          .replaceAll("<", "&lt;")

          .replaceAll(">", "&gt;")

          .replaceAll('"', "&quot;")

          .replaceAll("'", "&#039;");

<script>
async function setupTasksComboBox() {
    const input = document.getElementById("leaderBranch");
    const dropdown = document.getElementById("tasksDropdown");
    const combo = document.getElementById("taskComboBox");

    if (!input || !dropdown || !combo) return;

    let tasks = [];
    let addingMode = false;

    async function loadTasks() {
        const { data, error } = await AppDb.listTasks();

        if (error) {
            console.error("Error loading tasks:", error);
            return;
        }

        tasks = data || [];
    }

    function closeDropdown() {
        dropdown.classList.remove("open");
        dropdown.innerHTML = "";
    }

    function openTaskList() {
        addingMode = false;
        input.dataset.addingTask = "false";
        input.placeholder = "ابحث أو اختر المهمة";

        dropdown.innerHTML = "";

        const search = input.value.trim().toLowerCase();

        const filteredTasks = tasks.filter(function (task) {
            return task.name.toLowerCase().includes(search);
        });

        filteredTasks.forEach(function (task) {
            const option = document.createElement("div");
            option.className = "task-option";
            option.textContent = task.name;

            option.addEventListener("click", function () {
                input.value = task.name;
                closeDropdown();
            });

            dropdown.appendChild(option);
        });

        const addOption = document.createElement("div");
        addOption.className = "add-task-option";
        addOption.textContent = "＋ إضافة مهمة";

        addOption.addEventListener("click", function (event) {
            event.stopPropagation();
            startAddingTask();
        });

        dropdown.appendChild(addOption);

        dropdown.classList.add("open");
    }

    function startAddingTask() {
        addingMode = true;
        input.dataset.addingTask = "true";

        input.value = "";
        input.placeholder = "اكتب اسم المهمة";

        dropdown.innerHTML = "";

        const buttonsArea = document.createElement("div");
        buttonsArea.className = "task-action-buttons";

        const saveButton = document.createElement("button");
        saveButton.type = "button";
        saveButton.className = "save-task-button";
        saveButton.textContent = "حفظ المهمة";

        saveButton.addEventListener("click", async function (event) {
            event.stopPropagation();
            await saveNewTask();
        });

        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.className = "cancel-task-button";
        cancelButton.textContent = "إلغاء";

        cancelButton.addEventListener("click", function (event) {
            event.stopPropagation();

            addingMode = false;
            input.dataset.addingTask = "false";
            input.value = "";
            input.placeholder = "ابحث أو اختر المهمة";

            closeDropdown();
        });

        buttonsArea.appendChild(saveButton);
        buttonsArea.appendChild(cancelButton);
        dropdown.appendChild(buttonsArea);

        dropdown.classList.add("open");

        input.focus();
    }

    async function saveNewTask() {
        const name = input.value.trim();

        if (!name) {
            input.focus();
            return;
        }

        const normalizedName = name.toLowerCase();

        const existingTask = tasks.find(function (task) {
            return task.name.trim().toLowerCase() === normalizedName;
        });

        if (existingTask) {
            input.value = existingTask.name;
            addingMode = false;
            input.dataset.addingTask = "false";
            input.placeholder = "ابحث أو اختر المهمة";
            closeDropdown();
            return;
        }

        const { data, error } = await AppDb.createTask(name);

        if (error) {
            console.error("Error adding task:", error);

            if (error.code === "23505") {
                await loadTasks();

                const duplicateTask = tasks.find(function (task) {
                    return task.name.trim().toLowerCase() === normalizedName;
                });

                if (duplicateTask) {
                    input.value = duplicateTask.name;
                    addingMode = false;
                    input.dataset.addingTask = "false";
                    input.placeholder = "ابحث أو اختر المهمة";
                    closeDropdown();
                    return;
                }
            }

            alert("تعذر حفظ المهمة:\n" + (error.message || error.details || error.hint || "خطأ غير معروف"));
            return;
        }

        tasks.push(data);

        input.value = data.name;
        addingMode = false;
        input.dataset.addingTask = "false";
        input.placeholder = "ابحث أو اختر المهمة";

        closeDropdown();
    }

    input.addEventListener("focus", async function () {
        await loadTasks();

        if (addingMode) {
            dropdown.classList.add("open");
        } else {
            openTaskList();
        }
    });

    input.addEventListener("beforeinput", function (event) {
    if (event.inputType === "insertText" && event.data) {
        const hasEnglish = /[A-Za-z]/.test(event.data);

        if (hasEnglish) {
            event.preventDefault();
        }
    }
});

input.addEventListener("paste", function (event) {
    const text = (event.clipboardData || window.clipboardData).getData("text");

    if (/[A-Za-z]/.test(text)) {
        event.preventDefault();

        const arabicOnly = text.replace(/[A-Za-z]/g, "");

        if (arabicOnly) {
            document.execCommand("insertText", false, arabicOnly);
        }
    }
});
input.addEventListener("input", function () {
        if (!addingMode) {
            openTaskList();
        }
    });

    input.addEventListener("keydown", async function (event) {
        if (event.key === "Enter" && addingMode) {
            event.preventDefault();
            await saveNewTask();
        }

        if (event.key === "Escape") {
            addingMode = false;
            input.dataset.addingTask = "false";
            input.placeholder = "ابحث أو اختر المهمة";
            closeDropdown();
        }
    });

    document.addEventListener("click", function (event) {
        if (!combo.contains(event.target)) {
            closeDropdown();
        }
    });

    await loadTasks();
}

setupTasksComboBox();
</script>
