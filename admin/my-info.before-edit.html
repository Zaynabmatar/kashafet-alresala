<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>معلوماتي</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f4f7f5;
            color: #1f2d25;
            min-height: 100vh;
        }

        .topbar {
            width: 100%;
            height: 76px;
            background: #145c45;
            display: flex;
            align-items: center;
            padding: 0 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .back-button {
            border: none;
            background: transparent;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .container {
            width: min(900px, calc(100% - 40px));
            margin: 45px auto;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #68756e;
            font-size: 15px;
        }

        .info-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 25px;
            margin-bottom: 25px;
            border-bottom: 1px solid #e5eae7;
        }

        .avatar {
            width: 70px;
            height: 70px;
            min-width: 70px;
            border-radius: 50%;
            background: #e8f3ec;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #d7e8dc;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-header h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .profile-header span {
            color: #176b3a;
            font-size: 14px;
            font-weight: 600;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .info-item {
            background: #f7f9f8;
            border-radius: 12px;
            padding: 18px;
        }

        .info-label {
            display: block;
            color: #758079;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            word-break: break-word;
        }

        .message {
            text-align: center;
            padding: 35px;
            color: #68756e;
        }

        @media (max-width: 650px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: min(100% - 24px, 900px);
                margin: 25px auto;
            }

            .info-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <button
        class="back-button"
        type="button"
        onclick="history.back()"
    >
        ← رجوع
    </button>
</header>

<main class="container">

    <div class="page-header">
        <h1>معلوماتي</h1>
        <p>معلومات الحساب الحالي</p>
    </div>

    <section class="info-card">

        <div id="loadingMessage" class="message">
            جارٍ تحميل معلوماتك...
        </div>

        <div id="profileContent" style="display:none;">

            <div class="profile-header">

                <div class="avatar-wrapper"><label class="avatar" for="profileImageInput" title="اختيار صورة شخصية"><img id="profileImagePreview" src="" alt="الصورة الشخصية" style="display:none;"><span id="avatarPlaceholder">👤</span></label><button type="button" id="deleteProfileImage" style="display:none;">حذف الصورة</button></div>

                <input
                    type="file"
                    id="profileImageInput"
                    accept="image/*"
                    style="display:none;"
                >

                <div>
                    <h2 id="fullName">-</h2>
                    <span id="role">-</span>
                </div>

            </div>

            <div class="info-grid">

    <div class="info-item">
        <span class="info-label">الاسم الكامل</span>
        <div class="info-value" id="fullNameInfo">-</div>
    </div>

    <div class="info-item">
        <span class="info-label">العمر</span>
        <div class="info-value" id="ageInfo">-</div>
    </div>

    <div class="info-item">
        <span class="info-label">رقم الهاتف</span>
        <div class="info-value" id="phoneInfo">-</div>
    </div>

    <div class="info-item">
        <span class="info-label">الصلاحية</span>
        <div class="info-value" id="roleInfo">قائدة الكشافة</div>
    </div>

</div>

        </div>

        <div id="errorMessage" class="message" style="display:none;">
            ما قدرنا نجيب معلومات الحساب.
        </div>

    </section>

</main>

<script>
async function loadMyInfo() {
    const loadingMessage = document.getElementById("loadingMessage");
    const profileContent = document.getElementById("profileContent");
    const errorMessage = document.getElementById("errorMessage");

    try {
        const { data: profileIdData, error: profileIdError } = await supabaseClient.from("profiles").select("id").eq("role", "admin").single(); if (profileIdError || !profileIdData) { throw new Error("لم يتم العثور على حساب الأدمن"); } const adminId = profileIdData.id;

        const { data: profile, error: profileError } =
            await supabaseClient
                .from("profiles")
                .select("id, full_name, phone, birth_date, profile_image, role")
                .eq("id", adminId)
                .single();

        if (profileError || !profile) {
            throw new Error(
                profileError?.message || "Profile not found"
            );
        }

        // الاسم
        document.getElementById("fullName").textContent =
            profile.full_name || "غير محدد";

        document.getElementById("fullNameInfo").textContent =
            profile.full_name || "غير محدد";

        // الصلاحية
        const roleText =
            profile.role === "admin"
                ? "قائدة الكشافة"
                : profile.role === "leader"
                    ? "قائدة الكشافة"
                    : profile.role || "غير محدد";

        document.getElementById("role").textContent = roleText;
        document.getElementById("roleInfo").textContent = roleText;

        // رقم الهاتف
        document.getElementById("phoneInfo").textContent =
            profile.phone || "غير محدد";

        // العمر من تاريخ الميلاد
        let ageText = "غير محدد";

        if (profile.birth_date) {
            const birthDate = new Date(profile.birth_date);
            const today = new Date();

            let age = today.getFullYear() - birthDate.getFullYear();

            const monthDifference =
                today.getMonth() - birthDate.getMonth();

            if (
                monthDifference < 0 ||
                (
                    monthDifference === 0 &&
                    today.getDate() < birthDate.getDate()
                )
            ) {
                age--;
            }

            if (age >= 0) {
                ageText = age + " سنة";
            }
        }

        document.getElementById("ageInfo").textContent = ageText;

        // الصورة الحالية
        const imagePreview =
            document.getElementById("profileImagePreview");

        const placeholder =
            document.getElementById("avatarPlaceholder");

        if (profile.profile_image) {
            imagePreview.src = profile.profile_image;
            imagePreview.style.display = "block";
            placeholder.style.display = "none";
        }

        // إدارة صورة الملف الشخصي
        const imageInput = document.getElementById("profileImageInput");
        const deleteButton = document.getElementById("deleteProfileImage");

        async function showProfileImage(imageUrl) {
            const imagePreview = document.getElementById("profileImagePreview");
            const placeholder = document.getElementById("avatarPlaceholder");

            if (imageUrl) {
                imagePreview.src = imageUrl;
                imagePreview.style.display = "block";
                placeholder.style.display = "none";
                deleteButton.style.display = "block";
            } else {
                imagePreview.src = "";
                imagePreview.style.display = "none";
                placeholder.style.display = "inline";
                deleteButton.style.display = "none";
            }
        }

        if (profile.profile_image) {
            await showProfileImage(profile.profile_image);
        }

        imageInput.addEventListener("change", async function () {
            const file = this.files[0];
            if (!file) return;

            if (!file.type.startsWith("image/")) {
                alert("الرجاء اختيار صورة فقط.");
                return;
            }

            try {
                const filePath = adminId + "/profile." + file.name.split(".").pop().toLowerCase();

                const { error: uploadError } = await supabaseClient
                    .storage
                    .from("profiles")
                    .upload(filePath, file, {
                        upsert: true,
                        cacheControl: "3600"
                    });

                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient
                    .storage
                    .from("profiles")
                    .getPublicUrl(filePath);

                const imageUrl = urlData.publicUrl;

                const { error: updateError } = await supabaseClient
                    .from("profiles")
                    .update({ profile_image: imageUrl })
                    .eq("id", adminId);

                if (updateError) throw updateError;

                await showProfileImage(imageUrl);
                alert("تم حفظ الصورة بنجاح.");

            } catch (error) {
                console.error("Error saving profile image:", error);
                alert("لم نتمكن من حفظ الصورة.");
            }
        });

        deleteButton.addEventListener("click", async function () {
            if (!confirm("هل تريدين حذف الصورة الشخصية؟")) return;

            try {
                const { data: files, error: listError } =
                    await supabaseClient
                        .storage
                        .from("profiles")
                        .list(adminId);

                if (listError) throw listError;

                if (files && files.length > 0) {
                    const filePaths = files.map(file => adminId + "/" + file.name);

                    const { error: removeError } =
                        await supabaseClient
                            .storage
                            .from("profiles")
                            .remove(filePaths);

                    if (removeError) throw removeError;
                }

                const { error: updateError } =
                    await supabaseClient
                        .from("profiles")
                        .update({ profile_image: null })
                        .eq("id", adminId);

                if (updateError) throw updateError;

                profile.profile_image = null;

                await showProfileImage(null);

                imageInput.value = "";

                alert("تم حذف الصورة بنجاح.");

            } catch (error) {
                console.error("Error deleting profile image:", error);
                alert("لم نتمكن من حذف الصورة.");
            }
        });
        loadingMessage.style.display = "none";
        profileContent.style.display = "block";

    } catch (error) {
        console.error("Error loading my info:", error);

        loadingMessage.style.display = "none";
        errorMessage.textContent =
            "Error: " + error.message;
        errorMessage.style.display = "block";
    }
}
loadMyInfo();
</script>

</body>
</html>
