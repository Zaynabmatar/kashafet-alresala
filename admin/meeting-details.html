<!doctype html>
<html lang="ar" dir="rtl">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>تفاصيل الاجتماع - كشافة الرسالة</title>

        <link rel="stylesheet" href="../styles/admin.css">
        <link rel="stylesheet" href="../styles/meetings.css">

    </head>

    <body class="meeting-details-view">

        <header class="topbar">
            <div class="user-area">

                <button
                    class="menu-button"
                    id="backToMeetingsButton"
                    type="button"
                    title="العودة إلى الاجتماعات"
                    aria-label="العودة إلى الاجتماعات"
                >
                    ‹
                </button>

                <div class="page-topbar-title">معلومات الاجتماع</div>

            </div>
        </header>

        <main class="meeting-details-page">

            <div class="meeting-details-content">

                <section class="meeting-heading">

                    <h1 id="meetingTitle">اجتماع</h1>

                    <div class="meeting-date">
                        <span id="meetingDate"></span>
                    </div>

                </section>

                <section class="attendees-section">

                    <h2>الحاضرون</h2>

                    <p id="attendanceSummary" class="attendance-summary"></p>

                    <div id="presentLeaders" class="present-leaders-list"></div>

                </section>

                <button
                    id="editMeetingButton"
                    class="details-edit-button"
                    type="button"
                >
                    تعديل الاجتماع
                </button>

            </div>

        </main>

        <!-- تعديل الاجتماع -->
        <div id="editMeetingModal" class="meeting-modal">

            <div class="meeting-modal-box">

                <div class="meeting-modal-header">

                    <div>
                        <h2>تعديل الاجتماع</h2>

                    </div>

                    <button
                        id="closeEditMeetingButton"
                        class="close-modal-button"
                        type="button"
                    >
                        ×
                    </button>

                </div>

                <div class="edit-date-section">

                    <label for="editMeetingDateText">
                        تاريخ الاجتماع
                    </label>

                    <div class="custom-date-picker" id="editMeetingDatePicker">
                        <div class="typed-date-wrapper">
                            <input
                                type="text"
                                id="editMeetingDateText"
                                class="typed-date-input"
                                inputmode="numeric"
                                autocomplete="off"
                                placeholder="٢٢/٠٩/٢٠٢٦"
                                maxlength="10"
                            />

                            <button
                                id="editMeetingDateTrigger"
                                class="calendar-icon-button"
                                type="button"
                                aria-expanded="false"
                                aria-label="فتح الرزنامة"
                            >
                                📅
                            </button>
                        </div>

                        <input type="hidden" id="editMeetingDate" />

                        <div
                            id="editMeetingDatePopover"
                            class="custom-date-popover"
                            aria-hidden="true"
                        >
                            <div class="date-picker-selects">
                                <select
                                    id="editMeetingDay"
                                    aria-label="اليوم"
                                ></select>

                                <select
                                    id="editMeetingMonth"
                                    aria-label="الشهر"
                                ></select>

                                <select
                                    id="editMeetingYear"
                                    aria-label="السنة"
                                ></select>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="leader-search">

                    <span>⌕</span>

                    <input
                        type="text"
                        id="editLeaderSearch"
                        placeholder="ابحثي عن اسم القائد..."
                        inputmode="text"
                        lang="ar"
                        autocomplete="off"
                    >

                </div>

                <div id="editLeadersList" class="leaders-list"></div>

                <button
                    id="saveEditMeetingButton"
                    class="save-meeting-button"
                    type="button"
                >
                    حفظ التعديلات
                </button>

            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../supabase.js"></script>
        <script src="meeting-details.js"></script>

    </body>
</html>
