<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلوماتي</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>

    <link rel="stylesheet" href="../styles/my-info.css">
</head>
<body>
    <header class="topbar">
        <div class="user-area">
            <button
                class="menu-button"
                type="button"
                onclick="window.location.href='admin.html?sidebar=open'"
                title="العودة إلى قائمة القادة"
                aria-label="العودة إلى قائمة القادة"
            >
                ‹
            </button>
            <div class="page-topbar-title">معلوماتي</div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>معلوماتي</h1>
            <p>معلومات الحساب الحالي</p>
        </div>

        <section class="info-card">
            <div id="loadingMessage" class="message">
                جارٍ تحميل معلوماتك...
            </div>

            <div id="profileContent" class="is-hidden">
                <div class="avatar-wrapper">
                    <div class="avatar" aria-hidden="true">
                        <span>👤</span>
                    </div>
                </div>

                <div>
                    <h2 id="fullName">-</h2>
                    <span id="role">-</span>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">الاسم الكامل</span>
                    <div class="info-value" id="fullNameInfo">-</div>
                </div>

                <div class="info-item">
                    <span class="info-label">العمر</span>
                    <div class="info-value" id="ageInfo">-</div>
                </div>

                <div class="info-item">
                    <span class="info-label">رقم الهاتف</span>
                    <div class="info-value phone-value" id="phoneInfo" dir="ltr">-</div>
                </div>

                <div class="info-item">
                    <span class="info-label">الصلاحية</span>
                    <div class="info-value" id="roleInfo">قائدة الكشافة</div>
                </div>
            </div>

            <div id="errorMessage" class="message is-hidden">
                ما قدرنا نجيب معلومات الحساب.
            </div>
        </section>
    </main>

    <script src="my-info.js"></script>
</body>
</html>
