<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>معلوماتي</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f4f7f5;
            color: #1f2d25;
            min-height: 100vh;
        }

        .topbar {
            width: 100%;
            height: 76px;
            background: #176b3a;
            display: flex;
            align-items: center;
            padding: 0 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .back-button {
            border: none;
            background: transparent;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .container {
            width: min(900px, calc(100% - 40px));
            margin: 45px auto;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #68756e;
            font-size: 15px;
        }

        .info-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 25px;
            margin-bottom: 25px;
            border-bottom: 1px solid #e5eae7;
        }

        .avatar {
            width: 70px;
            height: 70px;
            min-width: 70px;
            border-radius: 50%;
            background: #e8f3ec;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #d7e8dc;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-header h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .profile-header span {
            color: #176b3a;
            font-size: 14px;
            font-weight: 600;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .info-item {
            background: #f7f9f8;
            border-radius: 12px;
            padding: 18px;
        }

        .info-label {
            display: block;
            color: #758079;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            word-break: break-word;
        }

        .message {
            text-align: center;
            padding: 35px;
            color: #68756e;
        }

        @media (max-width: 650px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: min(100% - 24px, 900px);
                margin: 25px auto;
            }

            .info-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <button
        class="back-button"
        type="button"
        onclick="history.back()"
    >
        ← رجوع
    </button>
</header>

<main class="container">

    <div class="page-header">
        <h1>معلوماتي</h1>
        <p>معلومات الحساب الحالي</p>
    </div>

    <section class="info-card">

        <div id="loadingMessage" class="message">
            جارٍ تحميل معلوماتك...
        </div>

        <div id="profileContent" style="display:none;">

            <div class="profile-header">

                <label class="avatar" for="profileImageInput" title="اختيار صورة شخصية">
                    <img id="profileImagePreview" src="" alt="الصورة الشخصية" style="display:none;">
                    <span id="avatarPlaceholder">👤</span>
                </label>

                <input
                    type="file"
                    id="profileImageInput"
                    accept="image/*"
                    style="display:none;"
                >

                <div>
                    <h2 id="fullName">-</h2>
                    <span id="role">-</span>
                </div>

            </div>

            <div class="info-grid">

    <div class="info-item">
        <span class="info-label">الاسم الكامل</span>
        <div class="info-value" id="fullNameInfo">-</div>
    </div>

    <div class="info-item">
        <span class="info-label">العمر</span>
        <div class="info-value" id="ageInfo">-</div>
    </div>

    <div class="info-item">
        <span class="info-label">رقم الهاتف</span>
        <div class="info-value" id="phoneInfo">-</div>
    </div>

    <div class="info-item">
        <span class="info-label">الصلاحية</span>
        <div class="info-value" id="roleInfo">قائدة الكشافة</div>
    </div>

</div>

        </div>

        <div id="errorMessage" class="message" style="display:none;">
            ما قدرنا نجيب معلومات الحساب.
        </div>

    </section>

</main>

<script>
async function loadMyInfo() {
    const loadingMessage = document.getElementById("loadingMessage");
    const profileContent = document.getElementById("profileContent");
    const errorMessage = document.getElementById("errorMessage");

    try {
        const adminId =
            new URLSearchParams(window.location.search).get("id");

        if (!adminId) {
            throw new Error("Admin ID not found");
        }

        const { data: profile, error: profileError } =
            await supabaseClient
                .from("profiles")
                .select("id, full_name, phone, birth_date, profile_image, role")
                .eq("id", adminId)
                .single();

        if (profileError || !profile) {
            throw new Error(
                profileError?.message || "Profile not found"
            );
        }

        // الاسم
        document.getElementById("fullName").textContent =
            profile.full_name || "غير محدد";

        document.getElementById("fullNameInfo").textContent =
            profile.full_name || "غير محدد";

        // الصلاحية
        const roleText =
            profile.role === "admin"
                ? "قائدة الكشافة"
                : profile.role === "leader"
                    ? "قائدة الكشافة"
                    : profile.role || "غير محدد";

        document.getElementById("role").textContent = roleText;
        document.getElementById("roleInfo").textContent = roleText;

        // رقم الهاتف
        document.getElementById("phoneInfo").textContent =
            profile.phone || "غير محدد";

        // العمر من تاريخ الميلاد
        let ageText = "غير محدد";

        if (profile.birth_date) {
            const birthDate = new Date(profile.birth_date);
            const today = new Date();

            let age = today.getFullYear() - birthDate.getFullYear();

            const monthDifference =
                today.getMonth() - birthDate.getMonth();

            if (
                monthDifference < 0 ||
                (
                    monthDifference === 0 &&
                    today.getDate() < birthDate.getDate()
                )
            ) {
                age--;
            }

            if (age >= 0) {
                ageText = age + " سنة";
            }
        }

        document.getElementById("ageInfo").textContent = ageText;

        // الصورة الحالية
        const imagePreview =
            document.getElementById("profileImagePreview");

        const placeholder =
            document.getElementById("avatarPlaceholder");

        if (profile.profile_image) {
            imagePreview.src = profile.profile_image;
            imagePreview.style.display = "block";
            placeholder.style.display = "none";
        }

        // اختيار صورة جديدة
        const imageInput =
            document.getElementById("profileImageInput");

        imageInput.addEventListener("change", async function () {
            const file = this.files[0];

            if (!file) return;

            if (!file.type.startsWith("image/")) {
                alert("الرجاء اختيار صورة فقط.");
                return;
            }

            const reader = new FileReader();

            reader.onload = async function (event) {
                const imageData = event.target.result;

                imagePreview.src = imageData;
                imagePreview.style.display = "block";
                placeholder.style.display = "none";

                const { error } = await supabaseClient
                    .from("profiles")
                    .update({
                        profile_image: imageData
                    })
                    .eq("id", adminId);

                if (error) {
                    console.error(
                        "Error saving profile image:",
                        error
                    );

                    alert(
                        "تم اختيار الصورة، لكن لم نتمكن من حفظها في قاعدة البيانات."
                    );
                }
            };

            reader.readAsDataURL(file);
        });

        loadingMessage.style.display = "none";
        profileContent.style.display = "block";

    } catch (error) {
        console.error("Error loading my info:", error);

        loadingMessage.style.display = "none";
        errorMessage.textContent =
            "Error: " + error.message;
        errorMessage.style.display = "block";
    }
}
loadMyInfo();
</script>

</body>
</html>
