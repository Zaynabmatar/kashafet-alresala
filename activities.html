<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأنشطة</title>

  <link rel="stylesheet" href="styles/activities.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <header class="activities-topbar">
    <div class="activities-topbar-inner">
      <button
        type="button"
        class="activities-back-button"
        aria-label="رجوع"
      >
        ‹
      </button>
    </div>
  </header>

  <main class="activities-page">
    <section class="activities-header">
      <div>
        <h1>الأنشطة</h1>
      </div>
    </section>

    <section class="add-activity-section">
      <button
        type="button"
        class="add-activity-button"
      >
        إضافة نشاط
      </button>
    </section>

    <div id="activityModal" class="activity-modal">
      <div class="activity-modal-box">
        <div class="form-header">
          <h2>إضافة نشاط</h2>
          <button
            type="button"
            class="close-form-button"
            aria-label="إغلاق"
          >
            ×
          </button>
        </div>

        <div class="activity-modal-body">
          <div class="form-group">
            <label for="activityTitle">عنوان النشاط</label>
            <input
              id="activityTitle"
              type="text"
              placeholder="مثلاً: نشاط رياضي"
              autocomplete="off"
            >
          </div>

          <div class="form-group">
            <label>تاريخ النشاط</label>
            <div class="typed-date-wrapper">
              <input
                id="activityDateText"
                class="typed-date-input"
                type="text" inputmode="text"
                placeholder="٢٢/٠٩/٢٠٢٦"
                maxlength="10"
                autocomplete="off"
              >
              <button
                type="button"
                id="activityDateTrigger"
                class="calendar-icon-button"
                aria-label="اختيار التاريخ"
              >
                📅
              </button>

              <div
                id="activityDatePicker"
                class="custom-date-popover"
              >
                <div class="date-picker-selects">
                  <select id="activityDay"></select>
                  <select id="activityMonth"></select>
                  <select id="activityYear"></select>
                </div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="memberSearch">البحث عن عنصر</label>
            <div class="member-search">
              <span>⌕</span>
              <input
                id="memberSearch"
                type="text"
                placeholder="ابحث عن عنصر..."
                autocomplete="off"
              >
            </div>
          </div>

          <div class="members-section">
            <div class="members-section-header">
              <div>
                <h3>العناصر</h3>
                <p id="selectedMembersCount">تم اختيار 0 عنصر</p>
              </div>
            </div>

            <div id="membersList" class="members-list">
              <div class="empty-state">
                لا يوجد عناصر
              </div>
            </div>
          </div>
        </div>

        <button
          id="saveActivityButton"
          type="button"
          class="save-activity-button"
        >
          حفظ النشاط
        </button>
      </div>
    </div>

    <section class="activities-list-section">
      <div class="activities-list-header">
        <h2>سجل الأنشطة</h2>
        <select id="activityYearFilter" class="year-filter">
          <option value="all">كل السنوات</option>
        </select>
      </div>

      <div id="activitiesList" class="activities-list">
        <div class="empty-state">
          لا توجد نشاطات
        </div>
      </div>
    </section>
  </main>

  <script src="activities.js"></script>
</body>
</html>
