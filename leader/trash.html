<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سلة المحذوفات</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>

  <link rel="stylesheet" href="../styles/admin.css">
  <link rel="stylesheet" href="../styles/trash.css">
  <link rel="stylesheet" href="../styles/leader-trash.css">
</head>
<body>

  <header class="topbar">
    <div class="user-area">
      <button
        class="menu-button"
        type="button"
        title="العودة إلى لوحة القائد"
      >
        ‹
      </button>
    </div>
  </header>

  <main class="trash-container">
    <div class="trash-header">
      <div>
        <h1>سلة المحذوفات</h1>
        <p>
          العناصر التي تم حذفها مؤقتًا. يمكنك ↩ استعادة أي عنصر في أي وقت.
        </p>
      </div>

      <div class="trash-total">
        <span>عدد المحذوفات</span>
        <strong id="trashTotal">0</strong>
      </div>
    </div>

    <section
      id="trashList"
      class="trash-list"
    ></section>

    <div
      id="trashEmpty"
      class="trash-empty"
    >
      🗑️

      <h2>سلة المحذوفات فارغة</h2>
      <p>
        لا يوجد عناصر محذوفة حاليًا.
      </p>
    </div>
  </main>

  <script src="trash.js"></script>
</body>
</html>
