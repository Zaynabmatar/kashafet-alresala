<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سلة المحذوفات</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>

  <link rel="stylesheet" href="../styles/admin.css"><link rel="stylesheet" href="../styles/trash.css">
<style>
  .trash-container {
    padding-top: 12px !important;
  }

  .topbar .user-area {
    display: flex !important;
    align-items: center !important;
  }

  .topbar .menu-button {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    visibility: visible !important;
    opacity: 1 !important;
  }
</style>
<style>
.member-trash-card {
  padding: 18px 20px;
}

.member-trash-card .member-main {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(260px, 1.4fr) minmax(240px, 1fr) auto;
  align-items: center;
  gap: 24px;
}

.member-trash-card .member-profile {
  display: flex;
  align-items: center;
  gap: 15px;
  min-width: 0;
}

.member-trash-card .member-avatar {
  width: 62px;
  height: 62px;
  flex: 0 0 62px;
  border-radius: 50%;
  overflow: hidden;
  background: #eef4f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
}

.member-trash-card .member-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.member-trash-card .member-identity {
  min-width: 0;
}

.member-trash-card .member-name-phone {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.member-trash-card .member-name-phone h3 {
  margin: 0;
  color: #1f2d25;
  font-size: 18px;
  font-weight: 700;
}

.member-trash-card .member-phone {
  color: #5e6b64;
  font-size: 13px;
}

.member-trash-card .member-info {
  display: flex;
  align-items: center;
  gap: 28px;
}

.member-trash-card .info-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.member-trash-card .info-label {
  color: #7a867f;
  font-size: 12px;
}

.member-trash-card .info-item strong {
  color: #1f2d25;
  font-size: 14px;
  white-space: nowrap;
}

.member-trash-card .has-uniform {
  color: #26734a !important;
}

.member-trash-card .no-uniform {
  color: #a34b4b !important;
}

.member-trash-card .member-card-actions {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-shrink: 0;
}

.member-trash-card .deleted-date {
  margin: 0;
  color: #929b96;
  font-size: 11px;
  white-space: nowrap;
}

.member-trash-card .restore-button {
  min-width: 105px;
  padding: 11px 18px;
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 92px;
}

@media (max-width: 850px) {
  .member-trash-card .member-main {
    grid-template-columns: 1fr;
    gap: 17px;
  }

  .member-trash-card .member-info {
    gap: 35px;
  }

  .member-trash-card .member-card-actions {
    justify-content: space-between;
  }

  .member-trash-card .restore-button {
  min-width: 105px;
  padding: 11px 18px;
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
    width: auto;
  }
}

@media (max-width: 600px) {
  .member-trash-card {
    padding: 16px;
  }

  .member-trash-card .member-avatar {
    width: 54px;
    height: 54px;
    flex-basis: 54px;
  }

  .member-trash-card .member-name-phone h3 {
    font-size: 16px;
  }

  .member-trash-card .member-info {
    gap: 28px;
  }

  .member-trash-card .member-card-actions {
    align-items: stretch;
    flex-direction: column;
    gap: 10px;
  }

  .member-trash-card .deleted-date {
    white-space: normal;
  }

  .member-trash-card .restore-button {
  min-width: 105px;
  padding: 11px 18px;
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
    width: 100%;
  }
}
</style></head>

<body>

<header class="topbar">
  <div class="user-area">
    <button
      class="menu-button"
      type="button"
      onclick="goBack()"
      title="العودة إلى لوحة القائد"
    >
      ‹
    </button>
  </div>
</header>


<main class="trash-container">

  <div class="trash-header">

    <div>
      <h1>سلة المحذوفات</h1>

      <p>
        العناصر التي تم حذفها مؤقتًا. يمكنك ↩ استعادة أي عنصر في أي وقت.
      </p>
    </div>

    <div class="trash-total">

      <span>عدد المحذوفات</span>

      <strong id="trashTotal">0</strong>

    </div>

  </div>


  <section
    id="trashList"
    class="trash-list"
  ></section>


  <div
    id="trashEmpty"
    class="trash-empty"
  >

    🗑️

    <h2>سلة المحذوفات فارغة</h2>

    <p>
      لا يوجد عناصر محذوفة حاليًا.
    </p>

  </div>

</main>


<script>
const leaderId =
  new URLSearchParams(window.location.search).get("id");

let deletedMembers = [];

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function calculateAge(birthDate) {
  if (!birthDate) return null;

  const birth = new Date(birthDate);
  if (Number.isNaN(birth.getTime())) return null;

  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();

  const month = today.getMonth() - birth.getMonth();

  if (
    month < 0 ||
    (month === 0 && today.getDate() < birth.getDate())
  ) {
    age--;
  }

  return age >= 0 ? age : null;
}

function formatPhone(phone) {
  if (!phone) return "";

  const value = String(phone).trim();

  if (value.startsWith("+961")) {
    return value;
  }

  if (value.startsWith("961")) {
    return "+" + value;
  }

  return value;
}

function formatDeletedDate(dateValue) {
  if (!dateValue) return "غير محدد";

  const date = new Date(dateValue);

  if (Number.isNaN(date.getTime())) {
    return "غير محدد";
  }

  return date.toLocaleDateString("ar-LB", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
}

function renderTrash() {
  const list = document.getElementById("trashList");
  const empty = document.getElementById("trashEmpty");
  const total = document.getElementById("trashTotal");

  if (!list || !empty || !total) return;

  total.textContent = deletedMembers.length;
  list.innerHTML = "";

  if (!deletedMembers.length) {
    list.style.display = "none";
    empty.style.display = "block";
    return;
  }

  list.style.display = "grid";
  empty.style.display = "none";

  deletedMembers.forEach(member => {
    const age = calculateAge(member.birth_date);
    const phone = formatPhone(member.phone);
    const uniform = member.has_uniform === true;

    const avatar = member.profile_image
      ? `<img src="${escapeHtml(member.profile_image)}" alt="">`
      : "👤";

    const card = document.createElement("article");
    card.className = "trash-card member-trash-card";

    card.innerHTML = `
      <div class="member-main">

        <div class="member-profile">

          <div class="member-avatar">
            ${avatar}
          </div>

          <div class="member-identity">

            <div class="member-name-phone">

              <h3>
                ${escapeHtml(member.full_name || "بدون اسم")}
              </h3>

              <span class="member-phone">
                📞 ${escapeHtml(phone || "غير محدد")}
              </span>

            </div>

          </div>

        </div>

        <div class="member-info">

          <div class="info-item">

            <span class="info-label">
              العمر
            </span>

            <strong>
              ${
                age !== null
                  ? escapeHtml(age) + " سنة"
                  : "غير محدد"
              }
            </strong>

          </div>

          <div class="info-item">

            <span class="info-label">
              البدلة
            </span>

            <strong class="${
              uniform
                ? "has-uniform"
                : "no-uniform"
            }">

              ${
                uniform
                  ? "✓ 👕 توجد بدلة"
                  : "✕ 👕 لا توجد بدلة"
              }

            </strong>

          </div>

        </div>

        <div class="member-card-actions">

          <div class="deleted-date">
            حُذف بتاريخ ${escapeHtml(
              formatDeletedDate(member.deleted_at)
            )}
          </div>

          <button
            class="restore-button"
            type="button"
            onclick="restoreMember('${escapeHtml(member.id)}')"
          >
            ↩ استعادة
          </button>

        </div>

      </div>
    `;

    list.appendChild(card);
  });
}

async function loadTrash() {
  if (!leaderId) {
    alert("تعذر تحديد القائد.");
    return;
  }

  try {
    const { data, error } = await supabaseClient
      .from("members")
      .select("*")
      .eq("leader_id", leaderId)
      .not("deleted_at", "is", null)
      .order("deleted_at", { ascending: false });

    if (error) {
      console.error("Load deleted members error:", error);
      alert("تعذر تحميل سلة المحذوفات.");
      return;
    }

    deletedMembers = data || [];
    renderTrash();

  } catch (error) {
    console.error("Trash error:", error);
    alert("حدث خطأ أثناء تحميل سلة المحذوفات.");
  }
}

async function restoreMember(memberId) {
  if (!leaderId) return;

  const member = deletedMembers.find(
    item => String(item.id) === String(memberId)
  );

  if (!member) return;

  const confirmed = confirm(
    "هل تريد ↩ استعادة هذا العنصر؟"
  );

  if (!confirmed) return;

  const { error } = await supabaseClient
    .from("members")
    .update({
      deleted_at: null
    })
    .eq("id", memberId)
    .eq("leader_id", leaderId);

  if (error) {
    console.error("Restore member error:", error);
    alert("تعذر ↩ استعادة العنصر.");
    return;
  }

  deletedMembers = deletedMembers.filter(
    item => String(item.id) !== String(memberId)
  );

  renderTrash();
}

function goBack() {
  window.location.href =
    "../leader-dashboard.html?id=" +
    encodeURIComponent(leaderId);
}

loadTrash();
</script>
</body>
</html>
