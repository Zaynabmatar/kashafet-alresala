<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كشافة الرسالة الإسلامية</title>

  <link rel="stylesheet" href="styles/index.css">
</head>
<body>
  <div class="page">
    <!-- الصورة الأصلية -->
    <img
      src="assets/images/phone login.jpeg"
      class="background-image"
      alt="كشافة الرسالة الإسلامية"
    >

    <!-- نافذة المستخدمين -->
    <div class="users-window">
      <div class="users-scroll">
        <div class="users-list">
          <!-- المستخدم الأول -->
          <button class="user-card" type="button">
            <span class="avatar" id="adminAvatarImage">
              <svg viewBox="0 0 24 24">
                <path d="M12 12 a4 4 0 1 0 0-8 a4 4 0 0 0 0 8 M4 21 c0-4.4 3.6-7 8-7 s8 2.6 8 7 Z"/>
              </svg>
            </span>
            <span class="user-name"></span>
          </button>

          <div id="leadersList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
