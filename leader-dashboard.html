<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة القائد - كشافة الرسالة</title>
  <link rel="stylesheet" href="styles/leader-dashboard.css">

</head>

<body>

<header class="leader-topbar">
  <div class="leader-topbar-inner">

    <button
      class="menu-button"
      type="button"
      id="toggleSidebarButton"
      aria-label="القائمة"
    >
      ☰
    </button>

    <div class="topbar-profile">
      <div class="topbar-avatar" id="topLeaderAvatar">👤</div>
      <strong id="topLeaderName">القائد</strong>
    </div>

  </div>
</header>

<aside class="leader-sidebar" id="leaderSidebar">

  <button
    class="sidebar-item"
    type="button"
    id="openMyInfoButton"
  >
    👤 معلوماتي
  </button>

  <div class="sidebar-stat">
    👥
    <span>
      عدد العناصر:
      <strong id="membersCount">0</strong>
    </span>
  </div>

  <div class="sidebar-stat missing-uniform-stat">
    🔴
    <span>
      عدد البدلات الناقصة:
      <strong id="missingUniformCount">0</strong>
    </span>
  </div>

  <button
    class="sidebar-item"
    type="button"
    id="openTrashButton"
  >
    🗑️ سلة المحذوفات <span id="trashCount" class="sidebar-count">0</span>
  </button>

  <button
    class="sidebar-item logout-item"
    type="button"
    id="logoutButton"
  >
    تسجيل الخروج
  </button>

</aside>

<main class="leader-page">

  <section class="page-header">

    <div>
      <h1>إدارة العناصر والأنشطة</h1>
      <p>إدارة العناصر والأنشطة التابعة لفرقتك</p>
    </div>

  </section>

  <section class="dashboard-actions">

    <button
      class="dashboard-action"
      type="button"
      id="openMembersButton"
    >
      <span class="add-button-content"><span class="add-button-plus">＋</span><strong>إضافة عنصر</strong></span>
    </button>

    <button
      class="dashboard-action"
      type="button"
      id="openActivitiesButton"
    >
      <strong>الأنشطة</strong>
    </button>

  </section>

  <section class="records-section" id="membersSection">

    <div class="section-header">

      <div>
        <h2>العناصر</h2>
        <p>العناصر التابعة لفرقتك</p>
      </div>

      <button
        class="add-button"
        type="button"
        id="openMemberModalButton"
      >
        <span>+</span>
        إضافة عنصر
      </button>

    </div>

    <div id="membersList" class="members-list">

      <div class="empty-state">
        <div class="empty-icon">👥</div>
        <h3>لا يوجد عناصر بعد</h3>
        <p>اضغط على «إضافة عنصر» لإضافة أول عنصر.</p>
      </div>

    </div>

  </section>

</main>

<div class="modal-overlay" id="memberModal">

  <div class="modal-card">

    <div class="modal-header">

      <div>
        <h2>إضافة عنصر</h2>
        <p>أدخل معلومات العنصر</p>
      </div>

      <button
        type="button"
        class="close-button"
        id="closeMemberModalButton"
      >
        ×
      </button>

    </div>

    <div class="form-group">

      <label for="memberName">اسم العنصر</label>

      <input
        id="memberName"
        type="text"
        placeholder="أدخل الاسم الكامل بالعربية"
        lang="ar"
        dir="rtl"
      >

    </div>

    <div class="form-group">

      <label for="memberPhone">رقم الهاتف</label>

      <div class="member-phone-field">
        <span class="member-phone-prefix">+961</span>
        <input
          id="memberPhone"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          dir="ltr"
        >
      </div>

    </div>

    <div class="form-group">
  <label>تاريخ الميلاد</label>

  <div class="birth-date-fields" dir="rtl">

    <input
      id="memberBirthDay"
      type="text"
      inputmode="numeric"
      maxlength="2"
      placeholder="اليوم"
      autocomplete="off"
    >

    <input
      id="memberBirthMonth"
      type="text"
      inputmode="numeric"
      maxlength="2"
      placeholder="الشهر"
      autocomplete="off"
    >

    <input
      id="memberBirthYear"
      type="text"
      inputmode="numeric"
      maxlength="4"
      placeholder="السنة"
      autocomplete="off"
    >

  </div>
</div>

    <div class="form-group">

      <label>البدلة</label>

      <div class="uniform-options">

        <label class="uniform-radio-option">
          <input
            type="radio"
            name="memberUniform"
            value="true"
            checked
          >
          <span>👕 توجد بدلة</span>
        </label>

        <label class="uniform-radio-option">
          <input
            type="radio"
            name="memberUniform"
            value="false"
          >
          <span>👕 لا توجد بدلة</span>
        </label>

      </div>

    </div>

    <button
      id="saveMemberButton"
      class="save-button"
      type="button"
    >
      حفظ العنصر
    </button>

  </div>

</div>

<div class="modal-overlay" id="activityModal">

  <div class="modal-card">

    <div class="modal-header">

      <div>
        <h2>إضافة نشاط</h2>
        <p>أدخل معلومات النشاط</p>
      </div>

      <button
        type="button"
        class="close-button"
        id="closeActivityModalButton"
      >
        ×
      </button>

    </div>

    <div class="form-group">

      <label for="activityTitle">عنوان النشاط</label>

      <input
        id="activityTitle"
        type="text"
        placeholder="مثلاً: نشاط رياضي"
      >

    </div>

    <div class="form-group">

      <label for="activityDescription">وصف النشاط</label>

      <textarea
        id="activityDescription"
        rows="4"
        placeholder="وصف مختصر للنشاط"
      ></textarea>

    </div>

    <div class="form-group">

      <label for="activityDateText">تاريخ النشاط</label>

      <div class="activity-date-inputs">
        <input
          id="activityDateText"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="DD/MM/YYYY"
          aria-label="Activity date, day/month/year"
        >
        <input
          id="activityDatePicker"
          type="date"
          aria-label="Choose activity date"
        >
      </div>
      <input id="activityDate" type="hidden">

    </div>

    <button
      id="saveActivityButton"
      class="save-button"
      type="button"
    >
      حفظ النشاط
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="leader-dashboard.js"></script>
</body>
</html>
