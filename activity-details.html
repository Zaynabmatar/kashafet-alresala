<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معلومات النشاط</title>

  <link rel="stylesheet" href="styles/activity-details.css">
</head>
<body>
  <header class="topbar">
    <div class="user-area">
      <button
        class="menu-button"
        type="button"
        title="العودة إلى الأنشطة"
        aria-label="العودة إلى الأنشطة"
      >
        ‹
      </button>
    </div>
  </header>

  <main class="activity-details-page">
    <div class="activity-details-content">
      <section class="activity-heading">
        <div class="activity-number" id="activityNumber">
          نشاط رقم ١
        </div>

        <h1 id="activityTitle">نشاط</h1>

        <div class="activity-date">
          <span id="activityDate"></span>
        </div>
      </section>

      <section class="attendees-section">
        <h2>الحاضرون</h2>
        <p id="attendanceSummary" class="attendance-summary"></p>
        <div id="presentMembers" class="present-members-list"></div>
      </section>

      <button
        id="editActivityButton"
        class="details-edit-button"
        type="button"
      >
        تعديل النشاط
      </button>
    </div>
  </main>

  <!-- تعديل النشاط -->
  <div id="editActivityModal" class="activity-modal">
    <div class="activity-modal-box">
      <div class="activity-modal-header">
        <div>
          <h2>تعديل النشاط</h2>
        </div>

        <button class="close-modal-button" type="button">
          ×
        </button>
      </div>

      <div class="edit-field">
        <label for="editActivityTitle">عنوان النشاط</label>
        <input type="text" id="editActivityTitle" autocomplete="off">
      </div>

      <div class="edit-date-section">
        <label for="editActivityDateText">تاريخ النشاط</label>

        <div class="custom-date-picker" id="editActivityDatePicker">
          <div class="typed-date-wrapper">
            <input
              type="text"
              id="editActivityDateText"
              class="typed-date-input"
              inputmode="text"
              autocomplete="off"
              placeholder="٢٢/٠٩/٢٠٢٦"
              maxlength="10"
            >

            <button
              id="editActivityDateTrigger"
              class="calendar-icon-button"
              type="button"
              aria-expanded="false"
              aria-label="فتح الرزنامة"
            >
              📅
            </button>
          </div>

          <input type="hidden" id="editActivityDate">

          <div
            id="editActivityDatePopover"
            class="custom-date-popover"
            aria-hidden="true"
          >
            <div class="date-picker-selects">
              <select id="editActivityDay" aria-label="اليوم"></select>
              <select id="editActivityMonth" aria-label="الشهر"></select>
              <select id="editActivityYear" aria-label="السنة"></select>
            </div>
          </div>
        </div>
      </div>

      <div class="member-search">
        <span>⌕</span>
        <input
          type="text"
          id="editMemberSearch"
          placeholder="ابحثي عن اسم العضو..."
          inputmode="text"
          lang="ar"
          autocomplete="off"
        >
      </div>

      <div id="editMembersList" class="members-list"></div>

      <button
        id="saveEditActivityButton"
        class="save-activity-button"
        type="button"
      >
        حفظ التعديلات
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="activity-details.js"></script>
</body>
</html>
